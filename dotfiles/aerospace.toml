# AeroSpace config, linked to ~/.config/aerospace/aerospace.toml by
# home/platforms/darwin.nix. Reference: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

key-mapping.preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# Workspaces are 1-9 only, with no letter workspaces, so alt-<letter> keys
# other than h/j/k/l/f still type macOS special characters.
# alt-<n> goes to workspace n wherever it is shown; ctrl-alt-<n> summons it
# to the focused monitor instead.
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-shift-f = 'fullscreen'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

ctrl-alt-1 = 'summon-workspace 1'
ctrl-alt-2 = 'summon-workspace 2'
ctrl-alt-3 = 'summon-workspace 3'
ctrl-alt-4 = 'summon-workspace 4'
ctrl-alt-5 = 'summon-workspace 5'
ctrl-alt-6 = 'summon-workspace 6'
ctrl-alt-7 = 'summon-workspace 7'
ctrl-alt-8 = 'summon-workspace 8'
ctrl-alt-9 = 'summon-workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Monitors: ctrl-alt moves the current workspace; focusing a monitor is in
# service mode, to avoid a three-modifier chord.
ctrl-alt-h = 'move-workspace-to-monitor left'
ctrl-alt-j = 'move-workspace-to-monitor down'
ctrl-alt-k = 'move-workspace-to-monitor up'
ctrl-alt-l = 'move-workspace-to-monitor right'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']
h = ['focus-monitor left', 'mode main']
j = ['focus-monitor down', 'mode main']
k = ['focus-monitor up', 'mode main']
l = ['focus-monitor right', 'mode main']
shift-h = ['join-with left', 'mode main']
shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with right', 'mode main']

# Float apps that don't tile well.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'cx.c3.theunarchiver'
run = 'layout floating'
