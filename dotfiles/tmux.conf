### 基础设置 ###
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',xterm*:Tc'   # 启用真彩色支持

set -g history-limit 30000                # 等价于 defscrollback 30000
set -g escape-time 10
set -g mouse on                           # 支持鼠标滚动、点击选择
set -g focus-events on
set -s set-clipboard on                   # 同步系统剪贴板（现代终端推荐）

### 启动与界面 ###
setw -g alternate-screen on               # 启用备用屏幕（等价于 altscreen on）

### 状态栏 ###
set -g status on
set -g status-position bottom
set -g status-bg colour235
set -g status-fg colour250
set -g status-interval 5

# 状态栏样式（参考你原来的 hardstatus string）
set -g status-left '#[fg=colour39,bold] #H #[default]'
set -g window-status-format '#[fg=colour244,bg=colour236] #I:#W #[default]'
set -g window-status-current-format '#[fg=colour255,bg=colour67,bold] #I:#W #[default]'
set -g status-right '#[fg=colour39]%a %Y-%m-%d #[fg=colour226]%H:%M#[default]'

# 快捷键：隐藏/显示状态栏
bind f set-option -g status off
bind F set-option -g status on

### 窗格导航（Vim风格 + 方向键） ###
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R

### 顶/底面板快速切换 ###
bind -r t select-pane -U
bind -r b select-pane -D

### 分屏快捷键（更自然的布局） ###
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

### 视觉优化 ###
setw -g pane-border-style fg=colour240
setw -g pane-active-border-style fg=colour39
# setw -g window-status-current-style fg=white,bg=red
# setw -g window-status-style fg=cyan,bg=default
set -g status-justify centre
set -g status-style bg=colour235,fg=colour250